<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra noche ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cinema" id="cinema">
    <img class="scene-img base-scene" src="assets/assetsscene-0.png" alt="Escena inicial del recuerdo">
    <img class="scene-img scene-one-img" src="assets/assetsscene-01.png" alt="Primera escena del recuerdo">
    <img class="scene-img scene-two-img" src="assets/assetsscene-1.png" alt="Segunda escena del recuerdo">
    <img class="scene-img scene-three-img" src="assets/assetsscene-2.png" alt="Tercera escena del recuerdo">

    <div class="vignette"></div>
    <div class="stars"></div>

    <div class="opening">
      <p>Eres el amor de mi vida</p>
      <h1>Feliz dia<br>al mejor novio.</h1>
      <button id="start">♥</button>
    </div>

  

    <div class="replay-wrap" id="replayWrap">
      <button id="replay">Volver ♥</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
